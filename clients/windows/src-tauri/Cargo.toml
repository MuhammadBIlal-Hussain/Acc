[package]
name = "ledgerforge"
version = "0.1.0"
description = "LedgerForge ERP Windows client"
authors = ["LedgerForge"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
