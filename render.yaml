services:
  - type: web
    name: ledgerforge-web
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerforge-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ""

databases:
  - name: ledgerforge-db
    plan: free
    databaseName: erp
    user: erp
