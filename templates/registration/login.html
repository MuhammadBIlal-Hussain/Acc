{% extends "base.html" %}
{% block title %}Sign in - LedgerForge ERP{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 4rem auto;">
    <h1>Sign in</h1>
    {% if form.errors %}<p role="alert">Your username or password was incorrect.</p>{% endif %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button style="background:#1769aa;padding:.7rem 1rem;border-radius:6px" type="submit">Sign in</button></form>
</div>
{% endblock %}
